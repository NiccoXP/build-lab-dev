<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Game with Stockfish</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Additional styles for Stockfish integration */
    #engine-status {
      display: inline-block;
      padding: 8px 12px;
      background: #e3f2fd;
      border-left: 4px solid #2196F3;
      border-radius: 4px;
      font-size: 13px;
      margin: 10px 0;
    }

    .engine-button {
      padding: 8px 15px;
      margin: 5px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .engine-button:hover {
      background: #1976D2;
    }

    .engine-button:active {
      transform: scale(0.98);
    }

    .engine-button.disabled {
      background: #bdbdbd;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <!-- Engine Status Display -->
  <div id="engine-status">⏳ Loading Stockfish Engine...</div>

  <!-- Original FEN Loader -->
  <div id="fen-loader" style="margin-bottom: 20px;">
    <label for="fen-input">Load FEN Position:</label>
    <input type="text" id="fen-input" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -" size="50">
    <button id="load-fen-button">Load Board</button>
  </div>
  
  <!-- Timer Display -->
  <div class="timer">
    <div id="white-time">10:00</div>
    <div id="black-time">10:00</div>
  </div>

  <!-- Chess Board -->
  <div id="wrapper">
      <div id="ranks"></div>
      <div id="chessboard"></div>
      <div id="files-bottom"></div>
  </div>
  
  <!-- Game Controls -->
  <div class="buttons">
    <button id="init">New Game</button>
    <button id="flip">Flip Board</button>
    <button id="play-vs-engine-btn" class="engine-button">⚔️ Play vs Engine</button>
    <button id="analyze-game-btn" class="engine-button">📊 Analyze Game</button>
  </div>

  <br>
  <br>

  <!-- Current FEN Display -->
  <div id="fen-loader" style="margin-bottom: 20px;">
    <label for="fen-input">Current FEN String:</label>
    <input type="text" id="current-fen" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -" size="50" disabled>
    <button id="copy-fen-button" onclick="copyFEN(this)">Copy</button>
  </div>

  <!-- Promotion Modal (from original) -->
  <div id="promotion-modal" class="hidden">
    <div id="promotion-dialog">
        <h3>Choose a piece for promotion:</h3>
        <div id="promotion-options">
        </div>
    </div>
  </div>

  <!-- Game Over Modal (from original) -->
  <div id="game-over-modal" class="hidden">
    <div id="game-over-dialog">
      <span id="close-game-over-dialog" class="close-button">&times;</span>

      <h3 id="game-over-header"></h3> 
        
      <p id="game-over-message"></p>
        
      <button id="new-game-button">Start New Game</button>
    </div>
  </div>

  <!-- Game Review Container (populated by Stockfish analysis) -->
  <div id="review-container"></div>

  <!-- Load Stockfish from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/stockfish@16.1.0/src/stockfish.js"></script>

  <!-- Load your original chess engine -->
  <script src="main.js"></script>

  <!-- Load Stockfish integration (custom for your app) -->
  <script src="stockfish-integration-for-your-app.js"></script>

  <!-- Load the integration setup script (see below) -->
  <script src="stockfish-app-setup.js"></script>
</body>

</html>
